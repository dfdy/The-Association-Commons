        transfer.
      links: []
    - type: h2
      text: 12. Sensitive information, children and decisions
      links: []
    - type: p
      text: The forms do not request identity numbers, health records, racial or ethnic information,
        religious beliefs, political persuasion, trade-union membership, criminal history or
        biometric data. Free text or an association’s stated purpose could nevertheless disclose
        sensitive information. The ordinary interest checkbox does not authorise every category of
        special personal information; POPIA sections 26–33 require an applicable authorisation.
      links: []
    - type: p
      text: No child-specific consent or verification process is configured. Before knowingly collecting a
        child’s information, the responsible party must establish an applicable basis under POPIA
        sections 34–35. Until appropriate arrangements are confirmed, do not submit a child’s
        identifying details through these forms.
      links: []
    - type: p
      text: Language-name matching suggests registered names; uncertain matches require your confirmation.
        Spam checks and rate limits can reject a request but do not decide membership. The
        application does not make automated membership decisions or build a profile for legal or
        similarly significant decisions.
      links: []
    - type: h2
      text: 13. Your rights and how to exercise them
      links: []
    - type: p
      text: Subject to the applicable legal conditions, you can ask whether personal information is held
        about you, request access, seek correction, request deletion of information that is
        inaccurate or no longer lawfully retained, and request restriction where appropriate. You
        can withdraw consent for future consent-based processing or object on applicable grounds.
        Withdrawal does not make earlier lawful processing unlawful. Some records may need to be
        retained for a specific lawful reason; a refusal should explain that reason and available
        recourse.
      links: []
    - type: p
      text: The project privacy contact is still pending, so an effective project request route must be
        published before public launch. Once available, identify the form or project, approximate
        submission date and the email used; provide only proportionate evidence needed to verify
        your request. Do not send an identity-document copy unless a justified verification process
        requires it. Browser cookies can be removed locally without identifying yourself. Anonymous
        suggestion counts may not be traceable to you without your request identifier.
      links: []
    - type: p
      text: The Information Regulator provides POPIA request forms, including objection and
        correction/deletion forms. Access to records may also involve PAIA where applicable; any
        required manual and Information Officer arrangements must be confirmed for the responsible
        party.
      links:
        - https://inforegulator.org.za/popia-forms/
    - type: h2
      text: 14. Complaints, external links and changes
      links: []
    - type: p
      text: "You can raise concerns with the project once its contact channel is published, and you may
        independently complain to South Africa’s Information Regulator. Use its current complaints
        instructions and eServices portal. General enquiries: enquiries@inforegulator.org.za, 010
        023 5200. Current contact information is available on the Regulator’s contact page. You do
        not waive complaint rights by using this site."
      links:
        - https://inforegulator.org.za/complaints/
        - https://eservices.inforegulator.org.za/
        - https://inforegulator.org.za/contact-us/
    - type: p
      text: External legislation, licence and other resource links take you to separate sites with their
        own privacy practices. No payment method is currently provided, and this application does
        not collect card or bank-account details for donations. Before a payment provider, mailing
        list, analytics tool, new data-sharing arrangement or other collection is introduced, this
        policy and any necessary choices must be updated.
      links: []
    - type: p
      text: Changes will be dated here. A policy update does not automatically authorise a new
        incompatible use of information previously collected. Additional notices or consent will be
        provided where required. The site’s displayed release number remains 0.0.2 unless its owner
        explicitly changes it.
      links: []
    - type: h2
      text: 15. Legal and operational references
      links: []
    - type: p
      text: This policy is framed around South African POPIA, including sections 9–14, 18–25, 26–35, 55,
        69, 71–72 and 74. Other laws may apply where the responsible party or visitors are located;
        this notice does not claim universal legal compliance. Official sources and the
        implementation facts above should guide the operator’s final review.
      links: []
