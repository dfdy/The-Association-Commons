name: "DDC: Language Suggestions"
slug: language-suggestions
type: plugin
version: 0.3.1
description: Accessible shortcode form with private language-suggestions storage.
icon: users
license: AGPL-3.0-only
author:
  name: "The Democratic Development Commons (DDC)"
dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: shortcode-core }
  - { name: api }
form:
  validation:
    strict: true
  fields:
    enabled:
      type: toggle
      label: Enabled
      highlight: 1
      default: 1
      options: {1: Yes, 0: No}
      validate: {type: bool}
    hourly_limit:
      type: number
      label: Successful submissions per connection per hour
      default: 10
      validate: {type: int, min: 1}
    retention_days:
      type: number
      label: Submission retention in days
      default: 90
      validate: {type: int, min: 1}
