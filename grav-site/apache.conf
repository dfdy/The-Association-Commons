<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(user/(accounts|config|data)|cache|logs|backup|tmp|vendor|system)">
    Require all denied
</DirectoryMatch>
ServerTokens Prod
ServerSignature Off
# Never log form bodies, query strings, tokens or passwords.
LogFormat "%h %t \"%m %U %H\" %>s %b" commons
CustomLog /proc/self/fd/1 commons
